<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    SIGN marketplace icon — 256x256.
    Used as the extension page hero icon on VS Code Marketplace and the Extensions panel.
    Brand: Midnight (#004150) ground, Mint (#4BBD9C / #6FCAB0) glyph, with a single
    accent node dot to suggest the graph nature of the notation.
  -->

  <!-- ground -->
  <rect x="0" y="0" width="256" height="256" rx="40" fill="#004150"/>

  <!-- subtle inner stroke for depth at large sizes -->
  <rect x="2.5" y="2.5" width="251" height="251" rx="38" fill="none" stroke="#0a5d6f" stroke-width="1"/>

  <!-- @ glyph: thick double-loop — center @ symbol stylized as graph traversal -->
  <!-- inner ring -->
  <circle cx="128" cy="132" r="34" fill="none" stroke="#4BBD9C" stroke-width="14" stroke-linecap="round"/>
  <!-- outer crescent (the tail of the @) -->
  <path d="M 168 132
           v 18
           a 16 16 0 0 0 16 16
           a 28 28 0 0 0 28 -28
           v -8
           a 84 84 0 1 0 -34 67"
        fill="none" stroke="#4BBD9C" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- graph node accent — single bright dot, upper right, signaling the "graph" in SIGN -->
  <circle cx="200" cy="56" r="14" fill="#6FCAB0"/>
  <!-- thin connector line from node to the @ outer ring, very subtle -->
  <line x1="192" y1="64" x2="172" y2="84" stroke="#6FCAB0" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
</svg>
